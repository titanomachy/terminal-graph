name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Nim ${{ matrix.nim }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        nim: ["2.0.x", "2.2.x", "stable"]
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: ${{ matrix.nim }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install terminal_style from GitHub
        run: nimble install -y https://github.com/titanomachy/terminal-style
      - run: nimble check
      - run: nimble test -y
      - run: nimble examples -y
      - if: matrix.os == 'ubuntu-latest' && matrix.nim == 'stable'
        run: nimble docs -y
