name: Documentation

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: stable
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install terminal_style from GitHub
        run: nimble install -y https://github.com/titanomachy/terminal-style
      - name: Install coverage tooling
        run: |
          sudo apt-get update
          sudo apt-get install --yes lcov
      - name: Run tests with coverage
        run: |
          mkdir -p build/coverage build/nimcache/coverage

          for test_file in tests/*.nim; do
            test_name="$(basename "$test_file" .nim)"
            nim c -r \
              --path:src \
              --debugger:native \
              --passC:--coverage \
              --passL:--coverage \
              --nimcache:"build/nimcache/coverage/$test_name" \
              --out:"build/coverage/$test_name" \
              "$test_file"
          done
      - name: Collect source coverage
        run: |
          lcov \
            --capture \
            --directory build/nimcache/coverage \
            --output-file coverage.info \
            --ignore-errors inconsistent,mismatch

          lcov \
            --extract coverage.info \
            "$GITHUB_WORKSPACE/src/*" \
            --output-file coverage.info \
            --ignore-errors inconsistent,unused

          lcov \
            --summary coverage.info \
            --ignore-errors inconsistent,corrupt
      - name: Generate API documentation
        run: nimble docs -y
      - name: Generate coverage badge
        run: |
          bash scripts/coverage_badge.sh coverage.info htmldocs/coverage.svg
          touch htmldocs/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: htmldocs

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
